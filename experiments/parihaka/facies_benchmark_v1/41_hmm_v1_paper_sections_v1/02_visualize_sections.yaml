data_root: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/data/parihaka/facies_benchmark_v1
prediction_root: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/paper_predictions/hmm_v1/parihaka/layout_000/large
output_root: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/paper_figures/hmm_v1/parihaka/layout_000/large
figure:
  rows: 2
  columns: 4
  dpi: 300
  width_mm: 180
  height_mm: 105
  font_size: 8
  title_size: 9
  axis_spine_width: 0.8
  font_family: Arial
  axis_label_size: 9
  tick_label_size: 8
  legend_size: 8
  panel_label_size: 10
