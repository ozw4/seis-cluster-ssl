dataset:
  survey_id: parihaka
inputs:
  labels_npy: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/data/parihaka/facies_benchmark_v1/parihaka_labels.npy
  labels_metadata_json: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/data/parihaka/facies_benchmark_v1/parihaka_labels_metadata.json
  reference_embedding_dir: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/embeddings/parihaka/facies_benchmark_v1/amp_mae_m075_mse_g0_patchnorm_clip8_agc65_vis01_v1/overlap_x64
  pretrained_checkpoint: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/pretraining/parihaka/facies_benchmark_v1/amp_mae_m075_mse_g0_patchnorm_clip8_agc65_vis01_v1/full_100ep/latest.pt
  random_checkpoint: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/pretraining/parihaka/facies_benchmark_v1/random_encoder_amp_mae_m075_mse_g0_patchnorm_clip8_agc65_vis01_seed42_v1/random_init/mae_random_seed42.pt
outputs:
  runs_root: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/channel_end_to_end_128_v1/runs
  output_dir: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/channel_end_to_end_128_v1/summary
  four_way_output_dir: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/channel_end_to_end_128_v1/four_way_summary
decoder:
  embedding_dim: 384
  class_count: 2
  hidden_channels: [128, 64, 32]
  upsample_factors:
    - [2, 2, 2]
    - [2, 2, 2]
    - [2, 2, 2]
  upsample_mode: nearest
  normalization: voxelwise_layer_norm
tiles:
  core_size_tokens: [8, 8, 8]
  context_halo_tokens: [4, 4, 4]
train:
  epochs: 50
  batch_size: 1
  encoder_learning_rate: 0.0001
  decoder_learning_rate: 0.001
  weight_decay: 0.0001
  class_weight: balanced
  sampling_mode: all_tiles_once
  seed: 42000
  amp: false
  gradient_clip_norm: 1.0
