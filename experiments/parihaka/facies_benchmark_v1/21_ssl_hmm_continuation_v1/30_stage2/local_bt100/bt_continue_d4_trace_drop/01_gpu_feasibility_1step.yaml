paths:
  artifact_root: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}
  output_root: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/pretraining/parihaka/facies_benchmark_v1/ssl_hmm_continuation_v1/stage2/local_bt100/bt_continue_d4_trace_drop/gpu_feasibility_1step
manifests:
  train: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/data/parihaka/facies_benchmark_v1/parihaka_amplitude_manifest.json
  train_path_list: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/data/parihaka/facies_benchmark_v1/parihaka_npy_paths.txt
data:
  local_crop_size: [128, 128, 128]
  min_valid_fraction: 0.1
  max_resample_attempts: 16
  normalized_clip_abs: 8.0
  finite_check_mode: strict
  amplitude_agc:
    enabled: true
    mode: trace_rms_z
    window_z: 65
    eps: 1.0e-3
    clip_abs: 5.0
zero_mask:
  enabled: true
  zero_atol: 0.0
  z_sample_influence_radius: 16
  xy_trace_influence_radius: 1
model:
  patch_size: [8, 8, 8]
  encoder_dim: 384
  encoder_depth: 8
  encoder_heads: 6
  decoder_dim: 256
  decoder_depth: 4
  decoder_heads: 4
continuation:
  init_checkpoint: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/pretraining/parihaka/facies_benchmark_v1/ssl_hmm_continuation_v1/stage1/local_barlow_twins_v1/full_100ep/latest.pt
  unfreeze_top_blocks: 1
augmentations:
  policy: xy_d4_trace_drop_v1
  reflection_probability: 0.5
  trace_drop_probability: 0.02
barlow_twins:
  method: local_barlow_twins_3d
  local_pairs_per_crop: 128
  projector_dim: 384
  redundancy_weight: 0.005
  normalization_eps: 1.0e-4
train:
  batch_size: 16
  samples_per_epoch: 16
  epochs: 1
  num_workers: 0
  prefetch_factor: null
  persistent_workers: false
  shuffle: true
  lr: 1.0e-5
  weight_decay: 0.05
  amp: false
  amp_dtype: auto
  device: cuda
  seed: 42
  grad_clip_norm: 1.0
  max_steps: 1
