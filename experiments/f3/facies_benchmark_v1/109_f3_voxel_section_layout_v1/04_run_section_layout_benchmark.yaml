paths:
  artifact_root: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}
  f3_root: ${F3_ROOT}
  source_label_volume: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/registry/volumes/f3/facies_benchmark_v1/f3_facies_labels.npy
  source_label_segy: ${F3_ROOT}/f3_labels.sgy
  png_label_inventory: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v1/inventory/label_png_inventory.csv
  segy_geometry_json: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v1/segy/segy_geometry.json
  class_info: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v1/inventory/class_info.json
dataset:
  name: f3_facies_benchmark
  version: facies_benchmark_v1
references:
  model_roster: ${SEIS_SSL_CLUSTER_WORKSPACE}/experiments/f3/facies_benchmark_v1/109_f3_voxel_section_layout_v1/00_model_roster.yaml
  section_layout_dataset_manifest: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/lithology/f3/facies_benchmark_v1/voxel_section_layout_v1/datasets_v1/section_layout_dataset_manifest.json
decoder:
  spec: frozen_embedding_decoder_nearest_voxel_ln_v1
  embedding_dim: 384
  class_count: 6
  hidden_channels: [128, 64, 32]
  upsample_factors: [[2, 2, 2], [2, 2, 2], [2, 2, 2]]
  upsample_mode: nearest
  normalization: voxelwise_layer_norm
tiles:
  core_size_tokens: [8, 8, 8]
  context_halo_tokens: [1, 1, 1]
train:
  epochs: 50
  batch_size: 1
  learning_rate: 0.001
  weight_decay: 0.0001
  class_weight: balanced
  sampling_mode: uniform_tiles_with_replacement
  steps_per_epoch: 440
  seed: 42000
  num_workers: 0
  amp: true
  gradient_clip_norm: 1.0
inference:
  write_probabilities: false
evaluation:
  monitored_class_ids: [3, 5]
  boundary_tolerances: [2, 4]
  boundary_region_radii: [2, 4]
  chunk_size_x: 8
outputs:
  benchmark_root: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/lithology/f3/facies_benchmark_v1/voxel_section_layout_v1/benchmark_v1
  smoke_root: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/smoke/f3/facies_benchmark_v1/voxel_section_layout_benchmark_v1
