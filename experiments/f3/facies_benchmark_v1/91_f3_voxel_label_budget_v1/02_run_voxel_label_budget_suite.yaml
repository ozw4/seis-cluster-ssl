suite:
  dataset_manifest: /workspace/artifacts/seis_ssl_cluster/lithology/f3/facies_benchmark_v1/voxel_label_budget_v1/original_split/voxel_label_budget_dataset_manifest.json
  output_root: /workspace/artifacts/seis_ssl_cluster/lithology/f3/facies_benchmark_v1/voxel_label_budget_v1/original_split
paths:
  artifact_root: /workspace/artifacts/seis_ssl_cluster
  f3_root: /home/dcuser/data/public_data/field/F3
dataset:
  name: f3_facies_benchmark
  version: facies_benchmark_v1
models:
  mae:
    model_tag: amp_mae_m075_mse_g0_patchnorm_clip8_agc65_vis01_v1
    embeddings_dir: /workspace/artifacts/seis_ssl_cluster/embeddings/f3/facies_benchmark_v1/amp_mae_m075_mse_g0_patchnorm_clip8_agc65_vis01_v1/overlap_x16
  m1:
    model_tag: strat_hmm_pretext_m1_k6_topblock1_distill
    embeddings_dir: /workspace/artifacts/seis_ssl_cluster/embeddings/f3/facies_benchmark_v1/strat_hmm_pretext_m1_k6_topblock1_distill/overlap_x16
  m2a:
    model_tag: strat_hmm_pretext_m2a_boundary_a050_t2_k6_topblock1_distill
    embeddings_dir: /workspace/artifacts/seis_ssl_cluster/embeddings/f3/facies_benchmark_v1/strat_hmm_pretext_m2a_boundary_a050_t2_k6_topblock1_distill/overlap_x16
budgets: [cap25, cap50, cap100]
subsample_seeds: [0, 1, 2, 3, 4]
seed_policy:
  base_seed: 42000
  add_subsample_seed: true
full_label_reference:
  mae_decoder_run: /workspace/artifacts/seis_ssl_cluster/lithology/f3/facies_benchmark_v1/amp_mae_m075_mse_g0_patchnorm_clip8_agc65_vis01_v1/overlap_x16/png_slices_segy_labels_v1/voxel_decoders/frozen_embedding_decoder_nearest_voxel_ln_v1
  m1_decoder_run: /workspace/artifacts/seis_ssl_cluster/lithology/f3/facies_benchmark_v1/strat_hmm_pretext_m1_k6_topblock1_distill/overlap_x16/png_slices_segy_labels_v1/voxel_decoders/frozen_embedding_decoder_nearest_voxel_ln_v1
  m2a_decoder_run: /workspace/artifacts/seis_ssl_cluster/lithology/f3/facies_benchmark_v1/strat_hmm_pretext_m2a_boundary_a050_t2_k6_topblock1_distill/overlap_x16/png_slices_segy_labels_v1/voxel_decoders/frozen_embedding_decoder_nearest_voxel_ln_v1
  require_shared_train_tile_identity: true
labels:
  seismic_volume: /workspace/artifacts/seis_ssl_cluster/registry/volumes/f3/facies_benchmark_v1/f3_seismic.npy
  source_label_volume: /workspace/artifacts/seis_ssl_cluster/registry/volumes/f3/facies_benchmark_v1/f3_facies_labels.npy
  source_label_segy: /home/dcuser/data/public_data/field/F3/f3_labels.sgy
  png_label_inventory: /workspace/artifacts/seis_ssl_cluster/inspection/f3/facies_benchmark_v1/inventory/label_png_inventory.csv
  segy_geometry_json: /workspace/artifacts/seis_ssl_cluster/inspection/f3/facies_benchmark_v1/segy/segy_geometry.json
  class_info: /workspace/artifacts/seis_ssl_cluster/inspection/f3/facies_benchmark_v1/inventory/class_info.json
decoder:
  spec: frozen_embedding_decoder_nearest_voxel_ln_v1
  embedding_dim: 384
  class_count: 6
  hidden_channels: [128, 64, 32]
  upsample_factors: [[2, 2, 2], [2, 2, 2], [2, 2, 2]]
  upsample_mode: nearest
  normalization: voxelwise_layer_norm
tiles:
  core_size_tokens: [8, 8, 8]
  context_halo_tokens: [1, 1, 1]
train:
  epochs: 50
  batch_size: 1
  learning_rate: 0.001
  weight_decay: 0.0001
  class_weight: balanced
  sampling_mode: uniform_tiles_with_replacement
  steps_per_epoch: 440
  num_workers: 0
  amp: true
  gradient_clip_norm: 1.0
inference:
  write_probabilities: false
evaluation:
  monitored_class_ids: [3, 5]
  boundary_tolerances: [2, 4]
  boundary_region_radii: [2, 4]
  chunk_size_x: 8
report:
  selected_slices:
    inline: []
    crossline: []
  dpi: 150
  include_confidence: false
  amplitude_clip_percentiles: [1.0, 99.0]
outputs:
  overwrite: false
  publish_individual_reports: false
