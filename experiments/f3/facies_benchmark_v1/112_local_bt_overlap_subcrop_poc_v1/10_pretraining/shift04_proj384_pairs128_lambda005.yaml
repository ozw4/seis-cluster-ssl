paths:
  artifact_root: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}
  output_root: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/pretraining/f3/facies_benchmark_v1/local_bt_overlap_subcrop_poc_v1/shift04_proj384_pairs128_lambda005
manifests:
  train: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/registry/manifests/f3/facies_benchmark_v1/f3_amplitude_manifest.json
  train_path_list: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/registry/splits/f3/facies_benchmark_v1/f3_npy_paths.txt
data:
  local_crop_size: [128, 128, 128]
  min_valid_fraction: 0.1
  max_resample_attempts: 16
  normalized_clip_abs: 8.0
  finite_check_mode: strict
  amplitude_agc:
    enabled: true
    mode: trace_rms_z
    window_z: 65
    eps: 1.0e-3
    clip_abs: 5.0
zero_mask:
  enabled: true
  zero_atol: 0.0
  z_sample_influence_radius: 16
  xy_trace_influence_radius: 1
model:
  patch_size: [8, 8, 8]
  encoder_dim: 384
  encoder_depth: 8
  encoder_heads: 6
  decoder_dim: 256
  decoder_depth: 4
  decoder_heads: 4
augmentations:
  policy: overlapping_subcrop_xy_v1
  horizontal_flip_probability: 0.5
  max_subcrop_shift_tokens: [4, 4, 0]
barlow_twins:
  method: local_barlow_twins_3d
  local_pairs_per_crop: 128
  projector_dim: 384
  redundancy_weight: 0.005
  normalization_eps: 1.0e-4
train:
  batch_size: 16
  samples_per_epoch: 10000
  epochs: 10
  num_workers: 8
  prefetch_factor: 2
  persistent_workers: true
  shuffle: true
  lr: 1.0e-4
  weight_decay: 0.05
  amp: false
  amp_dtype: auto
  device: cuda
  seed: 42
  grad_clip_norm: 1.0
