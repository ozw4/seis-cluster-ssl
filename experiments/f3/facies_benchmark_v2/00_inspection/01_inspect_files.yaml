paths:
  f3_root: ${F3_ROOT}
  artifact_root: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}
outputs:
  inspection_dir: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2
dataset:
  name: f3_facies_benchmark
  version: facies_benchmark_v2
inspection:
  inventory_dir: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/inventory
  output_json: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/inventory/file_inventory.json
  output_csv: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/inventory/file_inventory.csv
  output_markdown: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/inventory/file_inventory.md
  class_info_json: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/inventory/class_info.json
  label_png_inventory_csv: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/inventory/label_png_inventory.csv
  include_globs:
    - "**/*"
  exclude_globs:
    - "**/.DS_Store"
    - "**/__MACOSX/**"
  hash_files: false
