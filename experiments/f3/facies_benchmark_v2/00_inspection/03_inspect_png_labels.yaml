paths:
  f3_root: ${F3_ROOT}
  artifact_root: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}
outputs:
  inspection_dir: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2
dataset:
  name: f3_facies_benchmark
  version: facies_benchmark_v2
inspection:
  candidate_extensions:
    - .png
  allow_unknown_colors: false
  inventory_csv: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/labels/png_label_inventory.csv
  inventory_json: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/labels/png_label_inventory.json
  palette_json: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/labels/facies_palette.json
  class_counts_csv: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/labels/png_label_class_counts.csv
  summary_json: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/labels/png_label_summary.json
  summary_markdown: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/labels/png_label_summary.md
  class_distribution_train_png: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/stats/class_distribution_train.png
  class_distribution_validation_png: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/stats/class_distribution_validation.png
  class_distribution_per_slice_png: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/stats/class_distribution_per_slice.png
  figure_dpi: 300
