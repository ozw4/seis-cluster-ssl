paths:
  f3_root: ${F3_ROOT}
  artifact_root: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}
outputs:
  inspection_dir: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2
dataset:
  name: f3_facies_benchmark
  version: facies_benchmark_v2
inspection:
  segy_geometry_json: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/segy/segy_geometry.json
  png_label_inventory_json: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/labels/png_label_inventory.json
  palette_json: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/labels/facies_palette.json
  quicklook_dir: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/quicklook
  seismic_dir: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/quicklook/seismic
  labels_dir: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/quicklook/labels
  overlays_dir: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/quicklook/overlays
  metadata_json: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/inspection/f3/facies_benchmark_v2/stats/quicklook_metadata.json
  figure:
    dpi: 300
    final_candidate_dpi: 300
    background: white
    seismic_cmap: gray
    clip_percentiles: [1.0, 99.0]
    overlay_alpha: 0.45
    output_formats:
      - png
    optional_vector_formats:
      - pdf
      - svg
    xz_yz_origin: upper
    axis_labels: true
