paths:
  artifact_root: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}
manifests:
  input: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/registry/manifests/f3/facies_benchmark_v2/f3_amplitude_manifest.json
embeddings:
  # Token-geometry reference for v2 canonical supervision. Token validity is
  # encoder-independent under the shared zero-mask contract, so an existing
  # untrained encoder with the five-way geometry is used; only the valid-token
  # mask and metadata are consumed downstream, never these embeddings.
  checkpoint: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/pretraining/f3/facies_benchmark_v1/random_encoder_amp_mae_m075_mse_g0_patchnorm_clip8_agc65_vis01_seed42_v1/random_init/mae_random_seed42.pt
  output_dir: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/embeddings/f3/facies_benchmark_v2/reference_token_geometry/random_encoder_amp_mae_m075_mse_g0_patchnorm_clip8_agc65_vis01_seed42_v1/overlap_x64
embedding:
  window_size: [128, 128, 128]
  overlap: [64, 64, 64]
  output_dtype: float16
  batch_size: 1
  prefetch_queue_depth: 0
  amp: false
  amp_dtype: auto
  stage_timing: false
  min_token_valid_fraction: 0.5
  preprocessing_cache:
    mode: 'off'
    chunk_size_x: 16
    reuse: true
    cleanup: false
