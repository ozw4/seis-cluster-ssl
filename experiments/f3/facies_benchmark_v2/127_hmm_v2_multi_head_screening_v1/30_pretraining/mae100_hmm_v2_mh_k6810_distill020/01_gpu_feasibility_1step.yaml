paths:
  artifact_root: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}
  output_root: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/pretraining/f3/facies_benchmark_v1/hmm_v2_multi_head_screening_v1/mae100_hmm_v2_mh_k6810_distill020/smoke_1step
manifests:
  train: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/registry/manifests/f3/facies_benchmark_v1/f3_amplitude_manifest.json
  train_path_list: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/registry/splits/f3/facies_benchmark_v1/f3_npy_paths.txt
data:
  local_crop_size: [128, 128, 128]
  min_valid_fraction: 0.1
  max_resample_attempts: 16
  normalized_clip_abs: 8.0
  finite_check_mode: strict
  amplitude_agc:
    enabled: true
    mode: trace_rms_z
    window_z: 65
    eps: 1.0e-3
    clip_abs: 5.0
zero_mask:
  enabled: true
  zero_atol: 0.0
  z_sample_influence_radius: 16
  xy_trace_influence_radius: 1
model:
  patch_size: [8, 8, 8]
  encoder_dim: 384
  encoder_depth: 8
  encoder_heads: 6
  decoder_dim: 256
  decoder_depth: 4
  decoder_heads: 4
pseudo_targets:
  manifest: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/pseudo_targets/f3/facies_benchmark_v1/hmm_v2_multi_head_screening_v1/mh_k6810/multi_head_target_manifest.json
  target_representation: hard_viterbi_labels_v1
  min_confidence: 0.0
teacher:
  checkpoint: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/pretraining/f3/facies_benchmark_v1/ssl_hmm_continuation_v1/stage1/mae/full_100ep/latest.pt
student:
  init_checkpoint: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/pretraining/f3/facies_benchmark_v1/ssl_hmm_continuation_v1/stage1/mae/full_100ep/latest.pt
  unfreeze_top_blocks: 1
head:
  spec: multi_resolution_ordered_prototypes_v1
  ks: [6, 8, 10]
  projection_dim: 128
  temperature: 0.1
  normalize: true
loss:
  prototype_weight: 1.0
  usage_weight: 0.005
  entropy_floor: null
  distillation_weight: 0.2
  consistency_weight: 0.0
  consistency_beta: 0.1
train:
  batch_size: 16
  samples_per_epoch: 16
  epochs: 1
  num_workers: 0
  shuffle: true
  lr: 1.0e-5
  encoder_lr: 1.0e-5
  weight_decay: 0.05
  amp: false
  device: cuda
  seed: 42
  grad_clip_norm: 1.0
  max_steps: 1
  allow_overwrite_output: false
identity:
  model_tag: mae100_hmm_v2_mh_k6810_distill020
  scientific_identity:
    experiment_role: multi_head_ordered_pretext
    variant: nocons
    head_spec: multi_resolution_ordered_prototypes_v1
    head_ks: [6, 8, 10]
    target_manifest_sha256: ${SEIS_SSL_CLUSTER_MULTI_HEAD_TARGET_MANIFEST_SHA256}
    consistency_policy: normalized_order_smooth_l1_v1
  runtime_identity:
    device: cuda
    workers: 0
