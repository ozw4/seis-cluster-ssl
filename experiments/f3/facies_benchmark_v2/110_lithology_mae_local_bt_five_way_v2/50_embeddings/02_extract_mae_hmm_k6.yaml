paths:
  artifact_root: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}
manifests:
  input: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/registry/manifests/f3/facies_benchmark_v2/f3_amplitude_manifest.json
embeddings:
  # Explicit reuse of the v1 fixed-budget MAE 100 + HMM-K6 25 checkpoint; v2 does not retrain encoders.
  checkpoint: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/pretraining/f3/facies_benchmark_v1/ssl_hmm_continuation_v1/stage2/mae100/hmm/k6/full_25ep/latest.pt
  output_dir: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/embeddings/f3/facies_benchmark_v2/mae_local_bt_five_way_v2/mae_hmm_k6/overlap_x64
embedding:
  window_size: [128, 128, 128]
  overlap: [64, 64, 64]
  output_dtype: float16
  batch_size: 1
  prefetch_queue_depth: 0
  amp: false
  amp_dtype: auto
  stage_timing: false
  min_token_valid_fraction: 0.5
  preprocessing_cache:
    mode: 'off'
    chunk_size_x: 16
    reuse: true
    cleanup: false
