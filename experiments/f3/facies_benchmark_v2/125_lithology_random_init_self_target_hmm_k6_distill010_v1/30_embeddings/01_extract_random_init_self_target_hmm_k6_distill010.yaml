paths:
  artifact_root: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}
manifests:
  input: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/registry/manifests/f3/facies_benchmark_v2/f3_amplitude_manifest.json
embeddings:
  # Random-init (seed 42) encoder after the fixed-budget HMM-K6 Stage 2 (self-derived K=6 targets, distillation weight 0.1).
  checkpoint: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/pretraining/f3/facies_benchmark_v1/random_init_self_target_hmm_k6_distill010_v1/stage2/random_init/hmm/k6/full_25ep/latest.pt
  output_dir: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/embeddings/f3/facies_benchmark_v2/random_init_self_target_hmm_k6_distill010_v1/random_init_self_target_hmm_k6_distill010/overlap_x64
embedding:
  window_size: [128, 128, 128]
  overlap: [64, 64, 64]
  output_dtype: float16
  batch_size: 1
  prefetch_queue_depth: 0
  amp: false
  amp_dtype: auto
  stage_timing: false
  min_token_valid_fraction: 0.5
  preprocessing_cache:
    mode: 'off'
    chunk_size_x: 16
    reuse: true
    cleanup: false
