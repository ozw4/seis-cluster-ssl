paths:
  artifact_root: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}
  output_root: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/pretraining/volve/horizon_benchmark_v1/mae_local_bt_hmm_five_way_v1/stage2/mae100/hmm/k6/smoke_2step
identity:
  model_tag: volve_mae100_hmm_k6_topblock1_v1
manifests:
  train: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/data/volve/horizon_benchmark_v1/volve_amplitude_manifest.json
  train_path_list: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/data/volve/horizon_benchmark_v1/volve_npy_paths.txt
data:
  local_crop_size: [128, 128, 128]
  min_valid_fraction: 0.1
  max_resample_attempts: 16
  normalized_clip_abs: 8.0
  finite_check_mode: strict
  amplitude_agc:
    enabled: true
    mode: trace_rms_z
    window_z: 65
    eps: 1.0e-3
    clip_abs: 5.0
zero_mask:
  enabled: true
  zero_atol: 0.0
  z_sample_influence_radius: 16
  xy_trace_influence_radius: 1
model:
  patch_size: [8, 8, 8]
  encoder_dim: 384
  encoder_depth: 8
  encoder_heads: 6
  decoder_dim: 256
  decoder_depth: 4
  decoder_heads: 4
pseudo_targets:
  input_dir: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/pseudo_targets/volve/horizon_benchmark_v1/mae_local_bt_hmm_five_way_v1/mae100
  k: 6
  min_confidence: 0.0
teacher:
  checkpoint: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/pretraining/volve/horizon_benchmark_v1/amp_mae_m075_mse_g0_patchnorm_clip8_agc65_vis01_v1/full_100ep/latest.pt
student:
  init_checkpoint: ${SEIS_SSL_CLUSTER_ARTIFACT_ROOT}/pretraining/volve/horizon_benchmark_v1/amp_mae_m075_mse_g0_patchnorm_clip8_agc65_vis01_v1/full_100ep/latest.pt
  unfreeze_top_blocks: 1
head:
  num_prototypes: 6
  projection_dim: 128
  temperature: 0.1
  normalize: true
loss:
  prototype_weight: 1.0
  usage_weight: 0.005
  entropy_floor: null
  distillation_weight: 0.2
train:
  batch_size: 4
  samples_per_epoch: 10000
  epochs: 25
  num_workers: 8
  shuffle: true
  lr: 1.0e-5
  encoder_lr: 1.0e-5
  weight_decay: 0.05
  amp: false
  device: cuda
  seed: 42
  grad_clip_norm: 1.0
  max_steps: 2
  allow_overwrite_output: false
