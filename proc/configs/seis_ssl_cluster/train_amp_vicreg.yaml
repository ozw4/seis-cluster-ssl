paths:
  artifact_root: /workspace/artifacts/seis_ssl_cluster
  output_root: /workspace/artifacts/seis_ssl_cluster/pretraining/vicreg
manifests:
  train: /workspace/artifacts/seis_ssl_cluster/registry/manifests/train.json
  train_path_list: /workspace/artifacts/seis_ssl_cluster/registry/splits/train.txt
data:
  local_crop_size: [128, 128, 128]
model:
  patch_size: [8, 8, 8]
  encoder_dim: 384
  encoder_depth: 8
  encoder_heads: 6
  decoder_dim: 256
  decoder_depth: 4
  decoder_heads: 4
augmentations:
  horizontal_flip_probability: 0.5
vicreg:
  method: local_vicreg_3d
  local_pairs_per_crop: 128
train:
  batch_size: 16
  samples_per_epoch: 10000
  epochs: 100
